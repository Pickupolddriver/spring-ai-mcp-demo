server:
  port: 8081

spring:
  application:
    name: calculator-mcp-client
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        # 显式指定模型，不依赖 SDK 默认值：DeepSeekApi.DEFAULT_CHAT_MODEL 当前也是 flash，
        # 但写死才不会被 SDK 换默认值时悄悄改掉。Pro 换成 deepseek-v4-pro。
        model: deepseek-flash
    mcp:
      client:
        name: calculator-mcp-client
        version: 1.0.0
        type: SYNC
        # 与服务端 protocol 保持一致；连接的 endpoint 默认即 /mcp，无需显式声明。
        streamable-http:
          connections:
            calculator-server:
              url: http://localhost:8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html