server:
  port: 8081

spring:
  application:
    name: calculator-mcp-client
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
    mcp:
      client:
        name: calculator-mcp-client
        version: 1.0.0
        type: SYNC
        # 与服务端 protocol 保持一致；连接的 endpoint 默认即 /mcp，无需显式声明。
        streamable-http:
          connections:
            calculator-server:
              url: http://localhost:8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html