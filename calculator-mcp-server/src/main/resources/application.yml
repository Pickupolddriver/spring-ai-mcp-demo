server:
  port: 8080

spring:
  application:
    name: calculator-mcp-server
  ai:
    mcp:
      server:
        name: calculator-mcp-server
        version: 1.0.0
        # SSE（HTTP + SSE）传输：兼容 Spring AI 1.0 时代的 MCP 客户端。
        # 注意：Spring AI 2.0.0 起 SSE 已标记 deprecated，官方推荐 STREAMABLE。
        protocol: SSE
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

springdoc:
  swagger-ui:
    path: /swagger-ui.html